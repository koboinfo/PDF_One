          - SKAdNetworkIdentifier: "e5fvkxwrpn.skadnetwork"
          - SKAdNetworkIdentifier: "8c4e2ghe7u.skadnetwork"
          - SKAdNetworkIdentifier: "zq492l623r.skadnetwork"
          - SKAdNetworkIdentifier: "3rd42ekr43.skadnetwork"
          - SKAdNetworkIdentifier: "3qcr597p9d.skadnetwork"
        CFBundleDocumentTypes:
          - CFBundleTypeName: "PDF Document"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "com.adobe.pdf"
          - CFBundleTypeName: "Word Document"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "org.openxmlformats.wordprocessingml.document"
              - "com.microsoft.word.doc"
          - CFBundleTypeName: "Excel Spreadsheet"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "org.openxmlformats.spreadsheetml.sheet"
              - "com.microsoft.excel.xls"
          - CFBundleTypeName: "PowerPoint Presentation"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "org.openxmlformats.presentationml.presentation"
              - "com.microsoft.powerpoint.ppt"
    entitlements:
      path: PDF_One.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfone.PDFOne
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PDF_OneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: Subscriptions.storekit
    dependencies:
      - target: PDF_One
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfone.PDFOneTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
    testTargetHost: PDF_One

schemes:
  PDF_One:
    build:
      targets:
        PDF_One: all
        PDF_OneTests: [test]
    test:
      config: Debug
      storeKitConfiguration: Subscriptions.storekit
      targets:
        - PDF_OneTests
    run:
      config: Debug
      storeKitConfiguration: Subscriptions.storekit

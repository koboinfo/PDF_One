<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Preview only (rounded for Home Screen mockup). Export PNG must be unmasked full-bleed square. -->
  <title>PDF One App Icon — Dark (iOS 18 dark appearance)</title>
  <defs>
    <clipPath id="squircle-dark">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
    <linearGradient id="rainbow-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2673F2"/>
      <stop offset="20%" stop-color="#21B259"/>
      <stop offset="40%" stop-color="#FFCC26"/>
      <stop offset="60%" stop-color="#FF7A1A"/>
      <stop offset="80%" stop-color="#E63333"/>
      <stop offset="100%" stop-color="#592E8C"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle-dark)">
    <rect x="0" y="0" width="1024" height="1024" fill="#151517"/>

    <path d="M313.3,260.8 A179.2,179.2 0 1,1 324.0,383.4"
          fill="none" stroke="url(#rainbow-dark)" stroke-width="138.24"
          stroke-linecap="round"/>

    <path d="M353.28,138.24
             C307.2,307.2 286.72,430.08 307.2,558.08
             C332.8,675.84 307.2,757.76 430.08,839.68
             C512,896 389.12,916.48 307.2,880.64"
          fill="none" stroke="url(#rainbow-dark)" stroke-width="158.72"
          stroke-linecap="round" stroke-linejoin="round"/>

    <text x="957" y="963" text-anchor="end"
          font-family="Georgia, 'Hiragino Mincho ProN', serif" font-weight="800"
          font-size="128" fill="#EDF0F7">PDF</text>
  </g>
</svg>
